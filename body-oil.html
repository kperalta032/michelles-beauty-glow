<script>
function openCart() {
  if (!checkout) return;

  const items = document.getElementById('cart-items');
  items.innerHTML = '';

  checkout.lineItems.forEach(function(item) {
  const div = document.createElement('div');
  div.style.cssText =
    'padding:15px 0;border-bottom:1px solid #e5c5d1;';

  const row = document.createElement('div');
  row.style.cssText =
    'display:flex;align-items:center;gap:12px;';

  const photo = document.createElement('img');
  const image = item.variant?.image || item.image;
  if (image && image.src) {
    photo.src = image.src;
    photo.alt = item.title;
    photo.style.cssText =
      'width:65px;height:65px;object-fit:cover;border-radius:10px;';
    row.appendChild(photo);
  }

  const info = document.createElement('div');

  const name = document.createElement('strong');
  name.textContent = item.title;

  const details = document.createElement('p');
  details.textContent = item.variant.title;
  details.style.margin = '5px 0';

  const controls = document.createElement('div');
  controls.style.cssText =
    'display:flex;align-items:center;gap:10px;margin-top:10px;';

  const minus = document.createElement('button');
  minus.textContent = '−';

  const quantity = document.createElement('span');
  quantity.textContent = item.quantity;

  const plus = document.createElement('button');
  plus.textContent = '+';

  const remove = document.createElement('button');
  remove.textContent = 'Remove';
  remove.style.color = '#c0396b';

  [minus, plus, remove].forEach(function(btn) {
    btn.style.cursor = 'pointer';
    btn.style.padding = '6px 10px';
  });

  function updateQuantity(newQuantity) {
    const request = newQuantity <= 0
      ? client.checkout.removeLineItems(checkout.id, [item.id])
      : client.checkout.updateLineItems(checkout.id, [
          { id: item.id, quantity: newQuantity }
        ]);

    minus.disabled = true;
    plus.disabled = true;
    remove.disabled = true;

    request.then(function(updatedCheckout) {
      checkout = updatedCheckout;
      openCart();
    }).catch(function(error) {
      console.error('Unable to update cart:', error);
      alert('Unable to update your cart. Please try again.');
      openCart();
    });
  }

  minus.onclick = function() {
    updateQuantity(item.quantity - 1);
  };

  plus.onclick = function() {
    updateQuantity(item.quantity + 1);
  };

  remove.onclick = function() {
    updateQuantity(0);
  };

  controls.append(minus, quantity, plus, remove);
  info.append(name, details, controls);
  row.appendChild(info);
  div.appendChild(row);
  items.appendChild(div);
});
  const total = checkout.totalPrice.amount || checkout.totalPrice;
  document.getElementById('cart-total').textContent =
    'Total: $' + Number(total).toFixed(2);

  document.getElementById('side-cart').classList.add('open');
  document.getElementById('cart-overlay').style.display = 'block';
}

function closeCart() {
  document.getElementById('side-cart').classList.remove('open');
  document.getElementById('cart-overlay').style.display = 'none';
}

function goToCheckout() {
  if (checkout && checkout.webUrl) {
    window.location.href = checkout.webUrl;
  }
}
</script>
